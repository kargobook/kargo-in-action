# Chapter: 7. Multi-Service and Multi-Team Patterns
# Section: Isolating teams with per-Project namespaces and RBAC
# Kargo version: 1.11.0
# Status: UNVERIFIED

# The release bot's own identity. It authenticates with this
# ServiceAccount's token, so it needs no claim annotation.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments-release-bot
  namespace: payments
---
# Kargo's API server authorizes an SSO caller as the claim-annotated
# ServiceAccounts whose claims match that caller's token, never as the
# person. These two carry the claims for each tier.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments-team-sso
  namespace: payments
  annotations:
    rbac.kargo.akuity.io/claims: '{"groups":["payments-team"]}'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments-prod-sso
  namespace: payments
  annotations:
    rbac.kargo.akuity.io/claims: '{"sub":["alice","carol"]}'
---
# Read access for every promoter, from kargo-viewer: the built-in Role
# Kargo creates in each Project namespace. Without it, these subjects can
# promote but can't list Stages or Freight, so they can't see what to
# promote and the UI's Stage view stays empty.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: payments-promoter-viewers
  namespace: payments
subjects:
- kind: ServiceAccount        # the UI and kargo CLI path
  name: payments-team-sso
  namespace: payments
- kind: ServiceAccount
  name: payments-prod-sso
  namespace: payments
- kind: ServiceAccount
  name: payments-release-bot
  namespace: payments
- kind: Group                 # the direct kubectl path
  name: payments-team
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: kargo-viewer
  apiGroup: rbac.authorization.k8s.io
---
# Tier 1: the whole team may promote into the two lower Stages.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: promoter-lower
  namespace: payments
rules:
- apiGroups: ["kargo.akuity.io"]
  resources: ["promotions"]
  verbs: ["get", "list", "watch", "create"]
- apiGroups: ["kargo.akuity.io"]
  resources: ["stages"]
  verbs: ["promote"]
  resourceNames: ["payments-dev", "payments-pre-prod"]
---
# Both subject forms, because the two paths match different ones.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: payments-team-lower-promoters
  namespace: payments
subjects:
- kind: ServiceAccount        # the UI and kargo CLI path
  name: payments-team-sso
  namespace: payments
- kind: Group                 # the direct kubectl path
  name: payments-team
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: promoter-lower
  apiGroup: rbac.authorization.k8s.io
---
# Tier 2: production, restricted to two named approvers and the release bot.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: promoter-prod
  namespace: payments
rules:
- apiGroups: ["kargo.akuity.io"]
  resources: ["promotions"]
  verbs: ["get", "list", "watch", "create"]
- apiGroups: ["kargo.akuity.io"]
  resources: ["stages"]
  verbs: ["promote"]
  resourceNames: ["payments-prod"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: payments-prod-promoters
  namespace: payments
subjects:
- kind: ServiceAccount        # the UI and kargo CLI path
  name: payments-prod-sso
  namespace: payments
- kind: ServiceAccount
  name: payments-release-bot
  namespace: payments
- kind: User                  # the direct kubectl path
  name: alice
  apiGroup: rbac.authorization.k8s.io
- kind: User
  name: carol
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: promoter-prod
  apiGroup: rbac.authorization.k8s.io
