# Chapter: 7. Multi-Service and Multi-Team Patterns
# Section: Independent Promotion Graphs at Scale
# Kargo version: 1.12.1
# Status: UNVERIFIED

# tag::content[]
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: payments-dev
  namespace: kargo
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: payments-warehouse
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - uses: git-clone
        config:
          repoURL: https://github.com/kargobook/demo-gitops.git
          checkout:
          - branch: main
            path: ./repo
      - uses: yaml-update
        config:
          path: ./repo/apps/payments/envs/dev/values.yaml
          updates:
          - key: image.digest
            value: ${{ imageFrom("ghcr.io/kargobook/payments-api").Digest }}
      - uses: git-commit
        config:
          path: ./repo
          message: "Promote payments to dev: ${{ freight.image.tag }}"
      - uses: git-push
        as: push
        config:
          path: ./repo
          targetBranch: main
      - uses: argocd-update
        config:
          apps:
          - name: payments-dev
            sources:
            - repoURL: https://github.com/kargobook/demo-gitops.git
              desiredRevision: ${{ outputs.push.commit }}
              updateTargetRevision: true

# end::content[]
