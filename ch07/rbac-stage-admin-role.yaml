# Chapter: 7. Multi-Service and Multi-Team Patterns
# Section: Kubernetes RBAC for Namespace Isolation
# Kargo version: 1.12.1
# Status: UNVERIFIED

# tag::content[]
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stage-admin
  namespace: payments
rules:
- apiGroups: ["kargo.akuity.io"]
  resources: ["warehouses", "stages", "freight", "promotions"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# end::content[]
