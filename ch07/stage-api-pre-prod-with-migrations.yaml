# Chapter: 7. Multi-Service and Multi-Team Patterns
# Section: Schema Migrations and Coordinated Infrastructure
# Kargo version: 1.12.1
# Status: UNVERIFIED

# tag::content[]
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: api-pre-prod
  namespace: kargo
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: api-warehouse
    sources:
      stages:
      - api-dev
  - origin:
      kind: Warehouse
      name: migrations-warehouse
    sources:
      stages:
      - migrations-dev
  promotionTemplate:
    spec:
      steps:
      - uses: git-clone
        config:
          repoURL: https://github.com/kargobook/demo-gitops.git
          checkout:
          - branch: main
            path: ./repo
      - uses: yaml-update
        config:
          path: ./repo/apps/api/envs/pre-prod/values.yaml
          updates:
          - key: image.digest
            value: ${{ imageFrom("ghcr.io/example/api-service").Digest }}
      - uses: yaml-update
        config:
          path: ./repo/apps/migrations/envs/pre-prod/values.yaml
          updates:
          - key: image.digest
            value: ${{ imageFrom("ghcr.io/example/api-migrations").Digest }}
      - uses: git-commit
        config:
          path: ./repo
          message: "Coordinate api and migrations to pre-prod"
      - uses: git-push
        as: push
        config:
          path: ./repo
          targetBranch: main
      - uses: argocd-update
        config:
          apps:
          - name: api-pre-prod
            sources:
            - repoURL: https://github.com/kargobook/demo-gitops.git
              desiredRevision: ${{ outputs.push.commit }}
              updateTargetRevision: true
          - name: migrations-pre-prod
            sources:
            - repoURL: https://github.com/kargobook/demo-gitops.git
              desiredRevision: ${{ outputs.push.commit }}
              updateTargetRevision: true

# end::content[]
