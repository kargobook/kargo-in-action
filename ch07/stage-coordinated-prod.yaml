# Chapter: 7. Multi-Service and Multi-Team Patterns
# Section: Coordinated Production
# Kargo version: 1.12.1
# Status: UNVERIFIED

# tag::content[]
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: coordinated-prod
  namespace: kargo
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: api-warehouse
    sources:
      stages:
      - coordinated-pre-prod
  - origin:
      kind: Warehouse
      name: frontend-warehouse
    sources:
      stages:
      - coordinated-pre-prod
  promotionTemplate:
    spec:
      steps:
      - uses: git-clone
        config:
          repoURL: https://github.com/kargobook/demo-gitops.git
          checkout:
          - branch: main
            path: ./repo
      - uses: yaml-update
        config:
          path: ./repo/apps/api/envs/prod/values.yaml
          updates:
          - key: image.digest
            value: ${{ imageFrom("ghcr.io/example/api-service").Digest }}
      - uses: yaml-update
        config:
          path: ./repo/apps/frontend/envs/prod/values.yaml
          updates:
          - key: image.digest
            value: ${{ imageFrom("ghcr.io/example/frontend-service").Digest }}
      - uses: git-commit
        config:
          path: ./repo
          message: "Coordinate api ${{ freight.images[0].tag }} and frontend ${{ freight.images[1].tag }}"
      - uses: git-push
        as: push
        config:
          path: ./repo
          targetBranch: main
      - uses: argocd-update
        config:
          apps:
          - name: api-prod
            sources:
            - repoURL: https://github.com/kargobook/demo-gitops.git
              desiredRevision: ${{ outputs.push.commit }}
              updateTargetRevision: true
          - name: frontend-prod
            sources:
            - repoURL: https://github.com/kargobook/demo-gitops.git
              desiredRevision: ${{ outputs.push.commit }}
              updateTargetRevision: true

# end::content[]
