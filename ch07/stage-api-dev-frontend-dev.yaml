# Chapter: 7. Multi-Service and Multi-Team Patterns
# Section: Defining Independent Dev Stages
# Kargo version: 1.12.1
# Status: UNVERIFIED

# tag::content[]
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: api-dev
  namespace: kargo
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: api-warehouse
    sources:
      direct: true
  promotionTemplate:
    spec:
      autoPromotionEnabled: true
      steps:
      - uses: git-clone
        config:
          repoURL: https://github.com/kargobook/demo-gitops.git
          checkout:
          - branch: main
            path: ./repo
      - uses: yaml-update
        config:
          path: ./repo/apps/api/envs/dev/values.yaml
          updates:
          - key: image.digest
            value: ${{ imageFrom("ghcr.io/example/api-service").Digest }}
      - uses: git-commit
        config:
          path: ./repo
          message: "Promote api to dev: ${{ freight.image.tag }}"
      - uses: git-push
        as: push
        config:
          path: ./repo
          targetBranch: main
      - uses: argocd-update
        config:
          apps:
          - name: api-dev
            sources:
            - repoURL: https://github.com/kargobook/demo-gitops.git
              desiredRevision: ${{ outputs.push.commit }}
              updateTargetRevision: true
---
