# Chapter: Appendix A. Kargo Resource Reference
# Section: Subscription Fields
# Kargo version: 1.x
# Status: UNVERIFIED

subscriptions:
- image:
    repoURL: registry.example.com/my-app       # Required: OCI registry URL
    imageSelectionStrategy: SemVer             # SemVer | Lexical | NewestBuild | Digest
    constraint: ">=1.0.0 <2.0.0"               # Used when strategy is SemVer
    allowTagsRegexes:                           # Regex allow-list on tags
    - "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
    ignoreTagsRegexes:                          # Regexes for tags to ignore
    - latest
    - dev
    platform: linux/amd64                      # Optional: constrain to platform
    discoveryLimit: 20                         # Max Freight to retain

