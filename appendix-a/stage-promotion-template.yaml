# Chapter: Appendix A. Kargo Resource Reference
# Section: promotionTemplate Fields
# Kargo version: 1.12.1
# Status: UNVERIFIED

# tag::content[]
promotionTemplate:
  spec:
    vars:                                # Reusable template variables
    - name: gitopsRepo
      value: https://github.com/kargobook/demo-gitops.git
    steps:
    - uses: git-clone                    # Built-in step name
      as: clone                          # Alias for referencing outputs
      config:                            # Step-specific configuration
        repoURL: ${{ vars.gitopsRepo }}
        checkout:
        - branch: main
          path: ./repo
    - uses: yaml-update
      config:
        path: ./repo/envs/pre-prod/values.yaml
        updates:
        - key: image.digest
          value: ${{ imageFrom("registry.example.com/payments-api").Digest }}
    - uses: git-commit
      as: commit
      config:
        path: ./repo
        message: "chore: promote payments-api ${{ freight.images[0].tag }}"
    - uses: git-push
      as: push
      config:
        path: ./repo
    - uses: argocd-update
      config:
        apps:
        - name: payments-pre-prod
          sources:
          - repoURL: ${{ vars.gitopsRepo }}
            desiredRevision: ${{ outputs.push.commit }}
            updateTargetRevision: true

# end::content[]
