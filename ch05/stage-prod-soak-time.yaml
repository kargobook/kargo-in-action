# Chapter: 5. Promoting safely: automatic, manual, and recoverable
# Section: 5.4.1 Soak time
# Kargo version: 1.12.1
# Status: UNVERIFIED

# tag::content[]
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: demo
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: demo-app
    sources:                    # <1>
      stages:
      - pre-prod
      requiredSoakTime: 2h      # <2>
  promotionTemplate:
    spec:
      vars:
        - name: gitRepo
          value: https://github.com/kargobook/demo-gitops.git
      steps:
      - uses: git-clone
        config:
          repoURL: ${{ vars.gitRepo }}
          checkout:
          - branch: main
            path: ./repo
      - uses: yaml-update
        config:
          path: ./repo/envs/prod/values.yaml
          updates:
          - key: image.digest
            value: ${{ imageFrom("ghcr.io/kargobook/demo-app").Digest }}
      - uses: git-commit
        config:
          path: ./repo
          message: 'Promote to prod: ${{ imageFrom("ghcr.io/kargobook/demo-app").Tag }}'
      - uses: git-push
        as: push
        config:
          path: ./repo
          targetBranch: main
      - uses: argocd-update
        config:
          apps:
          - name: demo-prod
            sources:
            - repoURL: ${{ vars.gitRepo }}
              desiredRevision: ${{ outputs.push.commit }}
              updateTargetRevision: true
# end::content[]
