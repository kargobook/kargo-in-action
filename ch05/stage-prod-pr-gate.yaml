# Chapter: 5. Promoting safely: automatic, manual, and recoverable
# Section: 5.3.1 Pull request-based approval gates
# Kargo version: 1.12.1
# Status: UNVERIFIED

# tag::content[]
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: demo
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: demo-app
    sources:
      stages:
      - pre-prod                                                                         # <1>
  promotionTemplate:
    spec:
      vars:
        - name: gitRepo
          value: https://github.com/kargobook/demo-gitops.git
      steps:
      - uses: git-clone
        config:
          repoURL: ${{ vars.gitRepo }}
          checkout:
          - branch: main
            path: ./repo
      - uses: yaml-update
        config:
          path: ./repo/envs/prod/values.yaml
          updates:
          - key: image.digest
            value: ${{ imageFrom("ghcr.io/kargobook/demo-app").Digest }}
      - uses: git-commit
        config:
          path: ./repo
          message: 'Promote to prod: ${{ imageFrom("ghcr.io/kargobook/demo-app").Tag }}'
      - uses: git-push
        as: push
        config:
          path: ./repo
          generateTargetBranch: true                                                     # <2>
      - uses: git-open-pr
        as: open-pr                                                                      # <3>
        config:
          repoURL: ${{ vars.gitRepo }}
          sourceBranch: ${{ outputs.push.branch }}
          targetBranch: main                                                             # <4>
          title: 'Promote ${{ imageFrom("ghcr.io/kargobook/demo-app").Tag }} to production'
          description: |
            Promotes ghcr.io/kargobook/demo-app to production.
            Tag: ${{ imageFrom("ghcr.io/kargobook/demo-app").Tag }}

            Upstream stage: pre-prod

            Review the changes below and merge to approve the promotion.
      - uses: git-wait-for-pr
        as: wait-pr
        if: ${{ status('open-pr') != 'Skipped' }}                                        # <5>
        retry:
          timeout: 24h                                                                   # <6>
        config:
          repoURL: ${{ vars.gitRepo }}
          prNumber: ${{ outputs['open-pr'].pr.id }}                                      # <7>
      - uses: argocd-update
        config:
          apps:
          - name: demo-prod
            sources:
            - repoURL: ${{ vars.gitRepo }}
              desiredRevision: ${{ outputs['wait-pr']?.commit ?? outputs.push.commit }}  # <8>
              updateTargetRevision: true
# end::content[]
