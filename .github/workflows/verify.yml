name: verify
on: [push, pull_request]

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Parse every YAML file
      run: |
        python3 -m pip install --quiet pyyaml
        python3 - <<'PY'
        import fnmatch, glob, sys, yaml
        bad = []
        # Helm templates under charts/*/templates/ are Go text templates, not
        # YAML: {{ include ... }} and friends are not legal YAML syntax, so a
        # plain yaml.safe_load_all() will always fail on them regardless of
        # whether the chart itself is correct. They render to YAML only after
        # `helm template` substitutes their values, which this generic parse
        # check doesn't do. Excluded for that structural reason, the same way
        # ch03/kustomization-dev.yaml is excluded from the apply job's
        # dry-run loop below for being a non-Kubernetes build file.
        EXCLUDE_GLOBS = ["charts/*/templates/*.yaml"]
        files = sorted(glob.glob("**/*.yaml", recursive=True))
        files = [
            path for path in files
            if not any(fnmatch.fnmatch(path, pattern) for pattern in EXCLUDE_GLOBS)
        ]
        for path in files:
            try:
                list(yaml.safe_load_all(open(path, encoding="utf-8")))
            except yaml.YAMLError as err:
                bad.append(f"{path}: {str(err).splitlines()[0]}")
        for line in bad:
            print(line, file=sys.stderr)
        print(f"{len(files)} files, {len(bad)} failures")
        sys.exit(1 if bad else 0)
        PY

  apply:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Create a cluster
      uses: helm/kind-action@v1
    - name: Install cert-manager, Argo Rollouts, and Kargo
      run: |
        helm install cert-manager oci://quay.io/jetstack/charts/cert-manager \
          --namespace cert-manager --create-namespace --set crds.enabled=true --wait
        # Argo Rollouts CRDs and controller must exist *before* Kargo starts.
        # Kargo's controller checks for the AnalysisTemplate/AnalysisRun CRDs
        # once, at its own startup, and disables Rollouts integration for the
        # life of that process if they're missing at that moment. Verified
        # locally against a real Kargo 1.11.0 + Argo Rollouts 1.9.1 install:
        # installing the CRDs alone left an AnalysisRun stuck with no phase
        # forever (nothing reconciles it); only after the Argo Rollouts
        # controller was also running did the Job run and the AnalysisRun
        # reach `Successful`.
        kubectl create namespace argo-rollouts
        kubectl apply -n argo-rollouts -f https://github.com/argoproj/argo-rollouts/releases/download/v1.9.1/install.yaml
        kubectl wait --for=condition=Available deployment/argo-rollouts -n argo-rollouts --timeout=120s
        helm install kargo oci://ghcr.io/akuity/kargo-charts/kargo \
          --namespace kargo --create-namespace \
          --set api.adminAccount.passwordHash='$2a$10$placeholderplaceholderplaceholderplaceholderplaceholder' \
          --set api.adminAccount.tokenSigningKey=ci-signing-key \
          --wait
        kubectl get crds | grep kargo
        kubectl get crds | grep argoproj
    - name: Server-side dry-run every manifest
      run: |
        # A bare `kubectl create namespace` is not enough: Kargo's admission
        # webhook rejects Stages/Warehouses in a namespace unless it was
        # provisioned by a real (non-dry-run) Project apply, which is what
        # labels the namespace `kargo.akuity.io/project: "true"`. Verified
        # locally against a real Kargo 1.11.0 install: dry-running a Stage
        # against a `kubectl create namespace`-only namespace fails with
        # `namespace "demo" is not a project`.
        kubectl apply -f ch03/project-demo.yaml
        # No book example defines a Project named kargobook-demo (only
        # ch04/stage-coordinated-pre-prod.yaml and
        # ch04/warehouse-multi-artifact.yaml use that namespace); this
        # Project is CI scaffolding only, not sourced from the book.
        cat <<'PROJECT' | kubectl apply -f -
        apiVersion: kargo.akuity.io/v1alpha1
        kind: Project
        metadata:
          name: kargobook-demo
        PROJECT

        # Files below are intentionally excluded from the dry-run loop. Each
        # one legitimately cannot pass `kubectl apply --dry-run=server` in
        # this cluster (Kargo, cert-manager, and Argo Rollouts, but no Argo
        # CD, no pre-existing Warehouses/Freight) for a structural reason,
        # not a content bug. Do not add a file here to silence a real
        # failure; every entry must have a reason a reviewer can check.
        #
        # ch03/git-credentials-secret.yaml
        #   Contains credential-shaped placeholder material. Excluded from
        #   automated apply entirely; handled separately, out of scope for
        #   this CI check.
        # ch03/kustomization-dev.yaml
        #   `kind: Kustomization` is a Kustomize build file, not a
        #   Kubernetes API resource. There is no CRD for it; the API server
        #   would reject it with "no matches for kind". Build it with
        #   `kubectl kustomize` / `kustomize build`, not `kubectl apply`.
        # ch03/argocd-apps.yaml
        #   Requires Argo CD's `Application` CRD. Note that Argo CD and Argo
        #   Rollouts share the `argoproj.io` API group but ship disjoint CRD
        #   sets, so installing Argo Rollouts below does not supply
        #   `applications.argoproj.io`. This job installs no Argo CD, so that
        #   CRD does not exist here.
        # ch03/stage-dev-verification.yaml
        #   A `spec:`-only fragment showing where the `verification` block
        #   sits; no apiVersion/kind, so there is nothing for the API server
        #   to validate. It used to be a complete Stage named `dev` with an
        #   empty `promotionTemplate.spec`, which the CRD accepts and which
        #   would have wiped the live dev Stage's promotion steps on apply.
        # ch03/freight-example.yaml
        #   Documented in its own header as illustrative only: Freight is
        #   created by the Warehouse controller, never authored by hand.
        #   Its `metadata.name` is a content hash Kargo itself computes; a
        #   hand-typed value has no controller-created Warehouse behind it
        #   to match against.
        # ch03/promotion-example.yaml
        #   Documented in its own header as illustrative: it shows what
        #   Kargo persists in `status` *after* a promotion runs. `status`
        #   is a status subresource that a plain `apply` cannot set, and it
        #   references a Freight digest that was never created in this
        #   cluster.
        # ch04/warehouse-git-subscription.yaml
        # ch04/warehouse-helm-subscription.yaml
        # ch04/warehouse-image-subscription.yaml
        # ch04/warehouse-semver-prerelease.yaml
        #   Each is a bare `spec:`/field fragment used to show one
        #   subscription shape in isolation. None has `apiVersion`/`kind`,
        #   so the API server has nothing to validate against. Meant to be
        #   read and merged into a full Warehouse manifest, not applied.
        # ch04/stage-pre-prod-from-smoke.yaml
        # ch04/stage-prod-from-rc.yaml
        #   Same pattern: fragments showing only the `requestedFreight`
        #   delta, explicitly labeled "Fragment... merge into your full
        #   Stage manifest" in the file's own header comment.
        SKIP_FILES=(
          "ch03/git-credentials-secret.yaml"
          "ch03/kustomization-dev.yaml"
          "ch03/argocd-apps.yaml"
          "ch03/stage-dev-verification.yaml"
          "ch03/freight-example.yaml"
          "ch03/promotion-example.yaml"
          "ch04/warehouse-git-subscription.yaml"
          "ch04/warehouse-helm-subscription.yaml"
          "ch04/warehouse-image-subscription.yaml"
          "ch04/warehouse-semver-prerelease.yaml"
          "ch04/stage-pre-prod-from-smoke.yaml"
          "ch04/stage-prod-from-rc.yaml"
        )

        should_skip() {
          local target="$1"
          for skip in "${SKIP_FILES[@]}"; do
            [[ "$target" == "$skip" ]] && return 0
          done
          return 1
        }

        fail=0
        for f in $(find ch03 ch04 -name '*.yaml' | sort); do
          if should_skip "$f"; then
            echo "SKIP $f"
            continue
          fi
          if ! kubectl apply --dry-run=server -f "$f" >/dev/null 2>err.txt; then
            echo "FAIL $f"; cat err.txt; fail=1
          else
            echo "OK $f"
          fi
        done
        exit $fail
