# Chapter: 4. Modeling your delivery: Warehouses, Freight, and Stage graphs
# Section: 4.3 Designing Stage graphs
# Kargo version: 1.11.0
# Status: VERIFIED

# tag::content[]
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: smoke
  namespace: demo
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: demo-app
    sources:
      stages:
      - dev                                   # <1>
  verification:
    analysisTemplates:
    - name: smoke-health                      # <2>
  promotionTemplate:
    spec:
      vars:
        - name: gitRepo
          value: https://github.com/kargobook/demo-gitops.git
      steps:
      - uses: git-clone
        config:
          repoURL: ${{ vars.gitRepo }}
          checkout:
          - branch: main
            path: ./repo
      - uses: kustomize-set-image
        config:
          path: ./repo/envs/smoke             # <3>
          images:
          - image: ghcr.io/kargobook/demo-app
            digest: ${{ imageFrom("ghcr.io/kargobook/demo-app").Digest }}
      - uses: git-commit
        as: commit
        config:
          path: ./repo
          message: 'Promote to smoke: ${{ imageFrom("ghcr.io/kargobook/demo-app").Tag }}'
      - uses: git-push
        config:
          path: ./repo
          targetBranch: main
      - uses: argocd-update
        config:
          apps:
          - name: demo-smoke
            sources:
            - repoURL: ${{ vars.gitRepo }}
              desiredRevision: ${{ outputs['commit'].commit }}
# end::content[]
