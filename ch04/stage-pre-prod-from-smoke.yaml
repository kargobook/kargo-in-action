# Chapter: 4. Modeling your delivery: Warehouses, Freight, and Stage graphs
# Section: 4.3 Designing Stage graphs
# Kargo version: 1.11.0
# Status: UNVERIFIED
#
# Fragment showing the requestedFreight change that makes the pre-prod
# Stage subscribe to smoke (rather than directly to dev) once a smoke-test
# Stage has been inserted. Merge into your full pre-prod Stage manifest.

spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: demo-app
    sources:
      stages:
      - smoke
