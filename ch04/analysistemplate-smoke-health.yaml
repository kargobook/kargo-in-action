# Chapter: 4. Modeling your delivery: Warehouses, Freight, and Stage graphs
# Section: 4.3 From pipelines to Stage graphs
# Kargo version: 1.11.0
# Status: UNVERIFIED
#
# The template the smoke Stage in ch04/stage-smoke.yaml names. Same shape as
# ch03/analysistemplate-dev-health.yaml, pointed at demo-smoke, the namespace
# the smoke overlay deploys into. Chapter 3 never creates that namespace, which
# is why the two chapters carry separate templates.
#
# Uses the `job` provider for the same reason chapter 3's template does: the
# reader's demo-app is a static nginx image with no /healthz endpoint and no
# JSON body, and the `job` provider is the one whose pass/fail rule the 1.11.x
# docs state outright ("successful if the `Job` completes with an exit code of
# zero and is otherwise considered to have failed"). See the full rationale in
# the header of ch03/analysistemplate-dev-health.yaml.
#
# This is a real gate but a shallow one: it confirms the promoted image serves
# HTTP at `/` in demo-smoke. Deepening it into a genuine smoke suite means
# swapping the curl invocation for the service's own tests; nothing else about
# the Stage changes.

# tag::content[]
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: smoke-health
  namespace: demo
spec:
  metrics:
  - name: http-ok
    count: 3
    interval: 20s
    provider:
      job:
        spec:
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              containers:
              - name: probe
                image: curlimages/curl:8.11.1
                command:
                - curl
                - --fail
                - --silent
                - --show-error
                - --max-time
                - "10"
                - --output
                - /dev/null
                - http://demo-app.demo-smoke.svc.cluster.local/
# end::content[]
