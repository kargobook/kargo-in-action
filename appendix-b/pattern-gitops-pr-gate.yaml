# Chapter: Appendix B. Built-In Promotion Step Reference
# Section: GitOps Update with PR Gate
# Kargo version: 1.12.1
# Status: UNVERIFIED

# tag::content[]
vars:
- name: imageRepo
  value: registry.example.com/my-app
steps:
- uses: git-clone
  config:
    repoURL: https://github.com/kargobook/demo-gitops.git
    checkout:
    - branch: main
      path: ./repo
- uses: yaml-update
  config:
    path: ./repo/envs/prod/values.yaml
    updates:
    - key: image.digest
      value: ${{ imageFrom(vars.imageRepo).Digest }}
- uses: git-commit
  config:
    path: ./repo
    message: 'Promote ${{ imageFrom(vars.imageRepo).Tag }} to production'
- uses: git-push
  as: push
  config:
    path: ./repo
    generateTargetBranch: true
- uses: git-open-pr
  as: pr
  config:
    repoURL: https://github.com/kargobook/demo-gitops.git
    sourceBranch: ${{ outputs['push'].branch }}
    targetBranch: main
    title: "Promote ${{ imageFrom(vars.imageRepo).Tag }} to production"
- uses: git-wait-for-pr
  as: wait-pr
  retry:
    timeout: 4h
  config:
    repoURL: https://github.com/kargobook/demo-gitops.git
    prNumber: ${{ outputs['pr'].pr.id }}
- uses: argocd-update
  config:
    apps:
    - name: my-app-production
      sources:
      - repoURL: https://github.com/kargobook/demo-gitops.git
        desiredRevision: ${{ outputs['wait-pr'].commit }}
        updateTargetRevision: true

# end::content[]
