# Chapter: 3. Getting started with Kargo
# Section: 3.2 The core resource model
# Kargo version: 1.11.0
# Status: UNVERIFIED
#
# Exercised by hand on 2026-08-04 against a kind cluster running Kargo 1.11.0
# and Argo Rollouts 1.9.1: the file applies cleanly, and a dev Stage naming it
# drove an AnalysisRun to `Successful` (status.runSummary {"count":1,
# "successful":1}; three `http-ok` curl Jobs Complete). Still UNVERIFIED on
# purpose: by the companion repo's README.md rule only a CI run may set
# VERIFIED, and its verify.yml now installs Argo Rollouts and includes this
# file in the dry-run loop, so the next CI run is what flips the marker.
#
# Probes the dev environment, the only namespace chapter 3 creates for
# demo-app besides demo-pre-prod and demo-prod. Chapter 4's smoke Stage
# uses the same shape against demo-smoke: see
# ch04/analysistemplate-smoke-health.yaml.
#
# WHY THE `job` PROVIDER AND NOT `web`:
#
# The reader's demo-app is ghcr.io/kargobook/demo-app, built from
# examples/ch06-gitops-demo/demo-app/Dockerfile: nginx:1.27-alpine with one
# static index.html baked in, EXPOSE 80. It has no /healthz endpoint and
# returns no JSON, so a `web` provider with `jsonPath: "{$.status}"` and
# `successCondition: result == "healthy"` could never pass against it. (That
# JSON health body belongs to the chapter 7 sample services,
# examples/payments-api and examples/auth-service.)
#
# Pointing a `web` provider at `/` instead would return the static HTML page,
# but the semantics of `result` for a non-JSON body, and whether the provider
# fails a measurement on a non-2xx response, are not established anywhere we
# can check: Kargo vendors only the Argo Rollouts API type stubs
# (api/stubs/rollouts/v1alpha1/analysis_types.go), not the provider
# implementation, and the 1.11.x docs say only that "the response payload is
# set in a variable `result`".
#
# The `job` provider's pass/fail rule IS documented, in
# 50-user-guide/60-reference-docs/50-analysis-templates.md: "When a `Job` is
# used, the metric is considered successful if the `Job` completes with an exit
# code of zero and is otherwise considered to have failed." So the gate below
# rests only on that plus curl's own documented exit codes, and it asserts
# something demo-app really does: serve HTTP at `/` on port 80, which is the
# same thing base/deployment.yaml's readinessProbe checks.

# tag::content[]
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: dev-health
  namespace: demo
spec:
  metrics:
  - name: http-ok
    count: 3
    interval: 20s
    provider:
      job:
        spec:
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              containers:
              - name: probe
                image: curlimages/curl:8.11.1
                command:
                - curl
                - --fail
                - --silent
                - --show-error
                - --max-time
                - "10"
                - --output
                - /dev/null
                - http://demo-app.demo-dev.svc.cluster.local/
# end::content[]
