# Chapter: 3. Getting started with Kargo
# Section: Configuring Git credentials for Kargo
# Kargo version: 1.12.1
# Status: UNVERIFIED

# tag::content[]
apiVersion: v1
kind: Secret
metadata:
  name: demo-git-creds
  namespace: demo
  labels:
    kargo.akuity.io/cred-type: git
stringData:
  repoURL: https://github.com/kargobook/demo-gitops.git
  username: <your-git-username>
  password: <your-personal-access-token>

# end::content[]
